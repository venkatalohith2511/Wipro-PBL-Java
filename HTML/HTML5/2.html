<!DOCTYPE html>
<html>
<head>
<title>Online Registration - HTML5</title>
</head>
<body>
<center>
    <h2>Registration Form</h2>
    <form>
        <p>Username: <input type="text" name="username" placeholder="Enter username" required></p>
        <p>Password: <input type="password" name="password" placeholder="Enter password" required></p>
        <p>Confirm Password: <input type="password" name="confirm_password" placeholder="Confirm password" required></p>
        <p>Name: <input type="text" name="name" placeholder="Full name" required></p>
        <p>Gender: 
            <input type="radio" name="gender" value="male" required> Male 
            <input type="radio" name="gender" value="female" required> Female
        </p>
        <p>Address:<br>
            <textarea name="address" rows="5" cols="30" placeholder="Enter your full address here..."></textarea>
        </p>
        <p>Profession (Hold Ctrl/Cmd to select multiple):<br>
            <select name="profession" multiple required size="3">
                <option value="engineer">Engineer</option>
                <option value="doctor">Doctor</option>
                <option value="teacher">Teacher</option>
            </select>
        </p>
        <input type="submit" value="Submit">
    </form>
</center>
</body>
</html>
